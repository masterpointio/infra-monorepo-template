name: Lint

# Every pull request runs two jobs:
#
#   lint     Masterpoint's shared reusable lint workflow (trunk check + conventional PR title).
#
#   tf-docs  Enforces that the terraform-docs generated section of every module README is in
#            sync with that module's Terraform code. Locally this is handled by the trunk
#            `terraform-docs` pre-commit action, but a hook only runs when Terraform files are
#            staged and can be bypassed (or skipped entirely by bots such as Renovate), so stale
#            docs still land on main. This job regenerates the docs for every module against the
#            PR's merge commit and fails if the result differs from what is committed.
#
#            To fix a failure, regenerate the docs locally and commit the result:
#              terraform-docs --config .terraform-docs.yaml <module-dir> && trunk fmt <module-dir>/README.md
#
#            The job needs no secrets and only reads the repository, so it is safe to run on
#            pull_request (including PRs from forks) rather than pull_request_target.
on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    uses: masterpointio/actions/.github/workflows/lint.yaml@7dad35e85d864ca5dda0971dfd3c940cc67ed380 #v0.3.0
    permissions:
      actions: read # for trunk-action
      checks: write # for trunk-action
      contents: read # for trunk-action + checkout
      pull-requests: read # for action-semantic-pull-request

  tf-docs:
    name: tf-docs
    runs-on: ubuntu-latest
    permissions:
      contents: read # needed by checkout
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # terraform-docs is installed through aqua so CI runs exactly the version pinned in
      # aqua.yaml: the same one developers get locally and the one Renovate keeps up to date.
      - name: Cache aqua tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/aquaproj-aqua
          key: v1-aqua-installer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('aqua.yaml') }}
          restore-keys: |
            v1-aqua-installer-${{ runner.os }}-${{ runner.arch }}-

      - name: Install aqua
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.63.0

      # aqua-installer only creates the shims; the first call downloads the pinned version.
      - name: Install terraform-docs
        run: terraform-docs --version

      # The trunk fmt pre-commit hook runs prettier over regenerated READMEs before they are
      # committed, so CI has to apply the same formatting before comparing. The setup sub-action
      # only installs the trunk launcher (exposed as $TRUNK_PATH); linting stays with the lint job.
      - name: Install trunk
        uses: trunk-io/trunk-action/setup@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1

      - name: Check terraform-docs is up to date
        shell: bash
        run: |
          # Every directory holding .tf/.tofu files is a module, so root modules and child modules
          # are both covered no matter how the monorepo grows. Paths are NUL-delimited end to end
          # so directory names containing whitespace survive the pipeline.
          count=0
          while IFS= read -r -d '' dir; do
            echo "::group::terraform-docs ${dir}"
            terraform-docs --config .terraform-docs.yaml "${dir}"
            echo "::endgroup::"
            count=$((count + 1))
          done < <(
            find . -path ./.git -prune -o -name .terraform -prune -o \( -name '*.tf' -o -name '*.tofu' \) -print0 |
              while IFS= read -r -d '' file; do printf '%s\0' "${file%/*}"; done | sort -zu
          )
          if ((count == 0)); then
            echo "::error::No Terraform module directories were found, so there is nothing to check. This is almost certainly a bug in the discovery step above."
            exit 1
          fi
          echo "Regenerated docs for ${count} module directories."

          # --intent-to-add also makes READMEs that terraform-docs created from scratch visible
          # to `git diff`, so a brand new module that has no README yet is caught as well.
          git add --intent-to-add .
          git diff --name-only -z | xargs -0 -r "${TRUNK_PATH}" fmt --no-progress

          if ! git diff --quiet; then
            echo "::error::terraform-docs output is out of date. Regenerate the docs locally and commit the result (see the comment at the top of this workflow)."
            exit 1
          fi
          echo "terraform-docs output is up to date."

      - name: Show stale documentation diff
        if: failure()
        run: git --no-pager diff
